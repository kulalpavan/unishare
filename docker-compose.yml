services:
  postgres:
    image: postgres:16-alpine
    container_name: unishare-postgres
    environment:
      POSTGRES_USER: unishare
      POSTGRES_PASSWORD: unishare
      POSTGRES_DB: unishare
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - unishare_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unishare -d unishare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  unishare_pgdata:
